[project]
name = "reporting-contract"
version = "0.14.2"
description = "Versioned committed Accounting export contracts for Reports."
requires-python = "==3.12.*"
dependencies = ["billing-platform[crypto,mariadb]", "httpx==0.28.1"]
[tool.uv.sources]
billing-platform = { path = "../../libs/platform", editable = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/reporting_contract"]
