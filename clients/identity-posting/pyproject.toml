[project]
name = "identity-posting-client"
version = "0.3.0"
description = "Authenticated Identity reservation adapter for Accounting and Billing workers."
requires-python = "==3.12.*"
dependencies = ["billing-platform>=0.44.0,<0.45", "httpx==0.28.1"]

[tool.uv.sources]
billing-platform = { path = "../../libs/platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_posting"]
