[project]
name = "notification"
version = "0.1.0"
description = "Transactional notification orchestration for email, SMS, WhatsApp and push."
requires-python = "==3.12.*"
dependencies = [
    "billing-platform[mariadb]",
    "alembic>=1.14.0,<1.15",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "httpx>=0.28.0,<0.29",
    "cryptography>=44.0.0,<51",
    "aio-pika>=9.5.0,<10",
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
    "billing-platform[testing]",
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.25.0,<0.26",
    "pytest-cov>=6.0.0,<7",
    "mypy>=1.14.0,<2",
    "ruff>=0.8.0,<0.9",
    "aiosqlite>=0.20.0,<0.21",
    "testcontainers[mysql]>=4.9.0,<5",
]

[tool.uv.sources]
billing-platform = { path = "../../libs/platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RUF", "S"]
ignore = ["S101", "B008"]  # FastAPI dependency/query markers are declared in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tools/*" = ["T201", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["mysql: requires a live MySQL 9.6 container (needs Docker)"]
