[project]
name = "catalog"
version = "0.1.0"
description = "Catalog API foundation and product definition contracts."
requires-python = "==3.12.*"
dependencies = [
    "billing-platform",
    "billing-platform[mariadb]",
    # Typed authenticated source fences for the Accounting stock effect owner.
    "voucher-execution-client",
    "reporting-contract", # Scoped immutable inventory master source for Accounting.
    "alembic>=1.14.0,<1.15",
    # The read surfaces (FastAPI) and the ingestion consumer (aio-pika). CLAUDE.md §5.15:
    # each dependency has a stated reason.
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "aio-pika>=9.5.0,<10",
    # Signed Identity snapshot acquisition runs outside Catalog write transactions.
    "httpx>=0.28.0,<0.29",
    # Print-safe vector labels for existing Code 128/GTIN and QR product identifiers.
    "python-barcode==0.16.1",
    "qrcode==8.2",
]

[dependency-groups]
dev = [
    "billing-platform[testing]",
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.25.0,<0.26",
    "pytest-cov>=6.0.0,<7",
    "mypy>=1.14.0,<2",
    "ruff>=0.8.0,<0.9",
    "aiosqlite>=0.20.0,<0.21",
    "testcontainers[mysql]>=4.9.0,<5",
    "httpx>=0.28.0,<0.29",
    # Static typing for the bounded QR SVG label renderer.
    "types-qrcode==8.2.0.20260518",
]

[tool.uv.sources]
billing-platform = { path = "../../libs/platform", editable = true }
voucher-execution-client = { path = "../../clients/voucher-execution", editable = true }
reporting-contract = { path = "../../clients/reporting", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RUF", "S"]
ignore = ["S101", "B008"]  # assert is how tests assert; FastAPI markers live in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tools/*" = ["T201", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-markers"
markers = [
    "mysql: requires a live MySQL 9.6 container (needs Docker)",
]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]  # SQLAlchemy greenlets and FastAPI sync dependencies
source = ["src/catalog"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
