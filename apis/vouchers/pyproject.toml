[project]
name = "vouchers"
version = "0.1.0"
description = "Shared company voucher documents, configuration and durable workflows."
requires-python = "==3.12.*"
dependencies = [
  "voucher-execution-client", # Signed shared execution wire contract and client
  "billing-platform[crypto,mariadb,messaging]",
  "fastapi==0.115.14", # HTTP contracts and validation, same platform version
  "httpx==0.28.1", # Signed owner snapshot reads outside document transactions
  "uvicorn[standard]==0.34.3", # ASGI runtime, same platform version
  "celery==5.6.3", # Approved durable Purchase PDF worker on the VM
  "playwright==1.58.0", # Approved sandboxed Chromium PDF renderer, offline only
]

[dependency-groups]
dev = [
  "billing-platform[testing]",
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.3.0",
  "mypy==1.19.1",
  "ruff==0.8.6",
  "celery-types==0.26.0",
  "pypdf==6.7.0", # Verify actual PDF pages, extracted facts and pagination
]

[tool.uv.sources]
voucher-execution-client = { path = "../../clients/voucher-execution", editable = true }
billing-platform = { path = "../../libs/platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vouchers"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "T20", "RUF", "S"]
ignore = ["S101", "B008"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"tools/*" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--strict-markers"
markers = ["mysql: isolated native database integration", "rabbitmq: live broker integration"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["src/vouchers"]
branch = true
[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
