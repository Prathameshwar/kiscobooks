version: 1
metadata:
  name: Bill authenticated password change
entries:
  - model: authentik_flows.flow
    identifiers: {slug: bill-password-change}
    id: flow
    attrs: {name: KiscoBooks password change, title: Change your password, designation: stage_configuration, authentication: require_authenticated, denied_action: message}
  - model: authentik_policies_expression.expressionpolicy
    identifiers: {name: bill-password-change-actor}
    id: actor-policy
    attrs:
      execution_logging: false
      expression: |
        user = request.http_request.user
        if not user.is_authenticated or not user.is_active or not user.has_usable_password():
            ak_message("Use your sign-in provider to manage your password, or contact your administrator.")
            return False
        return True
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf flow, order: 0, policy: !KeyOf actor-policy}
    attrs: {failure_result: false}
  - model: authentik_policies_expression.expressionpolicy
    identifiers: {name: bill-password-change-current-actor}
    id: current-actor-policy
    attrs:
      execution_logging: false
      expression: |
        from authentik.flows.planner import PLAN_CONTEXT_PENDING_USER
        request.context["flow_plan"].context[PLAN_CONTEXT_PENDING_USER] = request.http_request.user
        return True
  - model: authentik_stages_password.passwordstage
    identifiers: {name: bill-password-change-current}
    id: current
    attrs:
      backends: [authentik.core.auth.InbuiltBackend]
      allow_show_password: true
      failed_attempts_before_cancel: 5
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers: {name: bill-password-change-mfa}
    id: mfa
    attrs: {not_configured_action: skip, last_auth_threshold: seconds=0}
  - model: authentik_stages_prompt.prompt
    identifiers: {name: bill-password-change-new}
    id: password
    attrs: {field_key: password, label: New password, type: password, required: true, order: 10, placeholder: '', initial_value: ''}
  - model: authentik_stages_prompt.prompt
    identifiers: {name: bill-password-change-repeat}
    id: repeat
    attrs: {field_key: password_repeat, label: Confirm new password, type: password, required: true, order: 20, placeholder: '', initial_value: ''}
  - model: authentik_policies_expression.expressionpolicy
    identifiers: {name: bill-password-change-validation}
    id: validation
    attrs:
      execution_logging: false
      expression: |
        data = request.context.get("prompt_data", {})
        password = data.get("password", "")
        if set(data) - {"component", "password", "password_repeat"}:
            return False
        if not 6 <= len(password) <= 128:
            ak_message("Use 6 to 128 characters for your new password.")
            return False
        if password != data.get("password_repeat"):
            ak_message("Your new passwords must match.")
            return False
        if request.user.check_password(password):
            ak_message("Choose a different password from your current password.")
            return False
        return True
  - model: authentik_stages_prompt.promptstage
    identifiers: {name: bill-password-change-prompt}
    id: prompt
    attrs: {fields: [!KeyOf password, !KeyOf repeat], validation_policies: [!KeyOf validation]}
  - model: authentik_stages_user_write.userwritestage
    identifiers: {name: bill-password-change-write}
    id: write
    attrs: {user_creation_mode: never_create}
  - model: authentik_stages_prompt.prompt
    identifiers: {name: bill-password-change-success}
    id: success-field
    attrs: {field_key: password_change_message, label: Password changed, type: static, required: false, order: 10, placeholder: 'Your password has been changed. Return to KiscoBooks, then sign out and sign in with your new password.', initial_value: ''}
  - model: authentik_stages_prompt.promptstage
    identifiers: {name: bill-password-change-complete}
    id: complete
    attrs: {fields: [!KeyOf success-field]}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, order: 10}
    id: current-binding
    attrs: {stage: !KeyOf current, evaluate_on_plan: true, re_evaluate_policies: true}
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf current-binding, order: 0, policy: !KeyOf current-actor-policy}
    attrs: {failure_result: false}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, order: 20}
    attrs: {stage: !KeyOf mfa}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, order: 30}
    attrs: {stage: !KeyOf prompt}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, order: 40}
    attrs: {stage: !KeyOf write}
  - model: authentik_flows.flowstagebinding
    identifiers: {target: !KeyOf flow, order: 50}
    attrs: {stage: !KeyOf complete}
