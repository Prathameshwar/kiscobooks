# Path-based routing for the Bill platform services.
# Copy to <nginx_root>\conf\conf.d\bill.conf (setup.ps1 does this).
#
# Keep the upstream list and the locations in step with conf/services.json.

upstream identity_upstream     { server 127.0.0.1:8001; }
upstream audit_upstream        { server 127.0.0.1:8002; }
upstream catalog_upstream      { server 127.0.0.1:8003; }
upstream notification_upstream { server 127.0.0.1:8010; }
upstream accounting_upstream   { server 127.0.0.1:8011; }
upstream vouchers_upstream     { server 127.0.0.1:8012; }
upstream reports_upstream      { server 127.0.0.1:8013; }
upstream design_upstream       { server 127.0.0.1:8014; }
limit_req_zone $binary_remote_addr zone=notification_callbacks:10m rate=5r/s;

# Shared across nginx workers. Empty keys exempt non-mutating requests.
map $request_method $voucher_write_client {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}
limit_req_zone $voucher_write_client zone=voucher_write:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=identity_auth:10m rate=10r/s;
limit_req_zone $voucher_write_client zone=design_write:10m rate=10r/s;

server {
    listen       127.0.0.1:8090 default_server;
    server_name  localhost;

    # Health probe on the nginx layer itself.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Optional public Auth API ingress; direct UI development ports also enforce
    # the distributed registration limit in Redis.
    location = /api/registration {
        limit_req zone=identity_auth burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:4310;
        include conf.d/proxy.include;
    }

    location /identity/ {
        limit_req zone=identity_auth burst=30 nodelay;
        limit_req_status 429;
        proxy_set_header X-Actor-Context "";
        proxy_set_header X-Actor-Signature "";
        proxy_set_header X-Original-URI "";
        rewrite ^/identity(/.*)$ $1 break;
        proxy_pass http://identity_upstream;
        include    conf.d/proxy.include;
    }
    # Internal service endpoints are never exposed by the public path router.
    location ^~ /identity/internal/ { return 404; }
    location ^~ /catalog/internal/ { return 404; }
    location ^~ /accounting/internal/ { return 404; }
    location ^~ /notification/internal/ { return 404; }
    location = /_audit_authorize {
        internal;
        proxy_pass http://identity_upstream/internal/v1/gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Company-Step-Up $http_x_company_step_up;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Actor-Context "";
        proxy_set_header X-Actor-Signature "";
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        include conf.d/proxy.include;
    }
    # Public infrastructure probes contain no tenant data.
    location = /audit/health/live {
        proxy_pass http://audit_upstream/health/live;
        include conf.d/proxy.include;
    }
    location = /audit/health/ready {
        proxy_pass http://audit_upstream/health/ready;
        include conf.d/proxy.include;
    }
    location /audit/ {
        error_page 401 = @accounting_unauthorized;
        error_page 403 = @accounting_forbidden;
        error_page 500 502 503 504 = @accounting_unavailable;
        auth_request /_audit_authorize;
        auth_request_set $gateway_auth_status $upstream_status;
        auth_request_set $audit_actor_context $upstream_http_x_actor_context;
        auth_request_set $audit_actor_signature $upstream_http_x_actor_signature;
        proxy_set_header X-Actor-Context $audit_actor_context;
        proxy_set_header X-Actor-Signature $audit_actor_signature;
        rewrite ^/audit(/.*)$ $1 break;
        proxy_pass http://audit_upstream;
        include conf.d/proxy.include;
    }
    location = /_catalog_authorize {
        internal;
        proxy_pass http://identity_upstream/internal/v1/gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Company-Step-Up $http_x_company_step_up;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Actor-Context "";
        proxy_set_header X-Actor-Signature "";
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        include conf.d/proxy.include;
    }
    # Public infrastructure probes; business paths resolve their actor through Identity.
    location = /catalog/health/live {
        proxy_pass http://catalog_upstream/health/live;
        include conf.d/proxy.include;
    }
    location = /catalog/health/ready {
        proxy_pass http://catalog_upstream/health/ready;
        include conf.d/proxy.include;
    }
    location /catalog/ {
        error_page 401 = @accounting_unauthorized;
        error_page 403 = @accounting_forbidden;
        error_page 500 502 503 504 = @accounting_unavailable;
        auth_request /_catalog_authorize;
        auth_request_set $gateway_auth_status $upstream_status;
        auth_request_set $catalog_actor_context $upstream_http_x_actor_context;
        auth_request_set $catalog_actor_signature $upstream_http_x_actor_signature;
        auth_request_set $catalog_company_context $upstream_http_x_company_context;
        auth_request_set $catalog_company_signature $upstream_http_x_company_signature;
        proxy_set_header X-Actor-Context $catalog_actor_context;
        proxy_set_header X-Actor-Signature $catalog_actor_signature;
        proxy_set_header X-Company-Context $catalog_company_context;
        proxy_set_header X-Company-Signature $catalog_company_signature;
        rewrite ^/catalog(/.*)$ $1 break;
        proxy_pass http://catalog_upstream;
        include conf.d/proxy.include;
    }
    location ^~ /notification/v1/callbacks/ {
        limit_req zone=notification_callbacks burst=60 nodelay;
        limit_req_status 429;
        access_log off; # Meta's verification query contains a secret token.
        client_max_body_size 1m;
        rewrite ^/notification(/.*)$ $1 break;
        proxy_pass http://notification_upstream;
        include conf.d/proxy.include;
    }
    location = /notification/health/live {
        proxy_pass http://notification_upstream/health/live;
        include conf.d/proxy.include;
    }
    location = /notification/health/ready {
        proxy_pass http://notification_upstream/health/ready;
        include conf.d/proxy.include;
    }
    location /notification/ {
        client_max_body_size 1m;
        set $notification_original_method $request_method;
        auth_request /_accounting_authorize;
        auth_request_set $gateway_auth_status $upstream_status;
        auth_request_set $notification_actor_context $upstream_http_x_actor_context;
        auth_request_set $notification_actor_signature $upstream_http_x_actor_signature;
        proxy_set_header X-Actor-Context $notification_actor_context;
        proxy_set_header X-Actor-Signature $notification_actor_signature;
        rewrite ^/notification(/.*)$ $1 break;
        proxy_pass http://notification_upstream;
        include    conf.d/proxy.include;
    }
    location = /_accounting_authorize {
        internal;
        proxy_pass http://identity_upstream/internal/v1/gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $notification_original_method;
        proxy_set_header X-Actor-Context "";
        proxy_set_header X-Actor-Signature "";
        proxy_set_header X-Company-Context "";
        proxy_set_header X-Company-Signature "";
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        include conf.d/proxy.include;
    }
    # Explicit public infrastructure probes; all business routes authenticate below.
    location = /accounting/health/live {
        proxy_pass http://accounting_upstream/health/live;
        include conf.d/proxy.include;
    }
    location = /accounting/health/ready {
        proxy_pass http://accounting_upstream/health/ready;
        include conf.d/proxy.include;
    }
    location /accounting/ {
        error_page 401 = @accounting_unauthorized;
        error_page 403 = @accounting_forbidden;
        error_page 500 502 503 504 = @accounting_unavailable;
        auth_request /_accounting_authorize;
        auth_request_set $gateway_auth_status $upstream_status;
        auth_request_set $accounting_actor_context $upstream_http_x_actor_context;
        auth_request_set $accounting_actor_signature $upstream_http_x_actor_signature;
        auth_request_set $accounting_company_context $upstream_http_x_company_context;
        auth_request_set $accounting_company_signature $upstream_http_x_company_signature;
        proxy_set_header X-Actor-Context $accounting_actor_context;
        proxy_set_header X-Actor-Signature $accounting_actor_signature;
        proxy_set_header X-Company-Context $accounting_company_context;
        proxy_set_header X-Company-Signature $accounting_company_signature;
        rewrite ^/accounting(/.*)$ $1 break;
        proxy_pass http://accounting_upstream;
        include    conf.d/proxy.include;
    }
    # Service-signed owner ingress is private, never exposed by the browser gateway.
    location ^~ /vouchers/internal/ { return 404; }
    location = /_vouchers_authorize {
        internal;
        proxy_pass http://identity_upstream/internal/v1/gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Company-Step-Up $http_x_company_step_up;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Actor-Context "";
        proxy_set_header X-Actor-Signature "";
        proxy_set_header X-Company-Context "";
        proxy_set_header X-Company-Signature "";
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        include conf.d/proxy.include;
    }
    # Explicit public infrastructure probes; all business routes authenticate below.
    location = /vouchers/health/live {
        proxy_pass http://vouchers_upstream/health/live;
        include conf.d/proxy.include;
    }
    location = /vouchers/health/ready {
        proxy_pass http://vouchers_upstream/health/ready;
        include conf.d/proxy.include;
    }
    location /vouchers/ {
        limit_req zone=voucher_write burst=120 nodelay;
        limit_req_status 429;
        error_page 429 = @voucher_rate_limited;
        error_page 401 = @accounting_unauthorized;
        error_page 403 = @accounting_forbidden;
        error_page 500 502 503 504 = @accounting_unavailable;
        auth_request /_vouchers_authorize;
        auth_request_set $gateway_auth_status $upstream_status;
        auth_request_set $vouchers_actor_context $upstream_http_x_actor_context;
        auth_request_set $vouchers_actor_signature $upstream_http_x_actor_signature;
        auth_request_set $vouchers_company_context $upstream_http_x_company_context;
        auth_request_set $vouchers_company_signature $upstream_http_x_company_signature;
        proxy_set_header X-Actor-Context $vouchers_actor_context;
        proxy_set_header X-Actor-Signature $vouchers_actor_signature;
        proxy_set_header X-Company-Context $vouchers_company_context;
        proxy_set_header X-Company-Signature $vouchers_company_signature;
        rewrite ^/vouchers(/.*)$ $1 break;
        proxy_pass http://vouchers_upstream;
        include    conf.d/proxy.include;
    }

    location ^~ /reports/internal/ { return 404; }
    location = /_reports_authorize {
        internal;
        proxy_pass http://identity_upstream/internal/v1/gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Company-Step-Up $http_x_company_step_up;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Actor-Context "";
        proxy_set_header X-Actor-Signature "";
        proxy_set_header X-Company-Context "";
        proxy_set_header X-Company-Signature "";
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        include conf.d/proxy.include;
    }
    # Explicit public infrastructure probes; all business routes authenticate below.
    location = /reports/health/live {
        proxy_pass http://reports_upstream/health/live;
        include conf.d/proxy.include;
    }
    location = /reports/health/ready {
        proxy_pass http://reports_upstream/health/ready;
        include conf.d/proxy.include;
    }
    location /reports/ {
        error_page 401 = @accounting_unauthorized;
        error_page 403 = @accounting_forbidden;
        error_page 500 502 503 504 = @accounting_unavailable;
        auth_request /_reports_authorize;
        auth_request_set $gateway_auth_status $upstream_status;
        auth_request_set $reports_actor_context $upstream_http_x_actor_context;
        auth_request_set $reports_actor_signature $upstream_http_x_actor_signature;
        auth_request_set $reports_company_context $upstream_http_x_company_context;
        auth_request_set $reports_company_signature $upstream_http_x_company_signature;
        proxy_set_header X-Actor-Context $reports_actor_context;
        proxy_set_header X-Actor-Signature $reports_actor_signature;
        proxy_set_header X-Company-Context $reports_company_context;
        proxy_set_header X-Company-Signature $reports_company_signature;
        rewrite ^/reports(/.*)$ $1 break;
        proxy_pass http://reports_upstream;
        include    conf.d/proxy.include;
    }
    location ^~ /design/internal/ { return 404; }
    location = /_design_authorize {
        internal;
        proxy_pass http://identity_upstream/internal/v1/gateway/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Company-Step-Up $http_x_company_step_up;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Actor-Context "";
        proxy_set_header X-Actor-Signature "";
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        include conf.d/proxy.include;
    }
    # Explicit public infrastructure probes; all business routes authenticate below.
    location = /design/health/live {
        proxy_pass http://design_upstream/health/live;
        include conf.d/proxy.include;
    }
    location = /design/health/ready {
        proxy_pass http://design_upstream/health/ready;
        include conf.d/proxy.include;
    }
    location /design/ {
        error_page 401 = @accounting_unauthorized;
        error_page 403 = @accounting_forbidden;
        error_page 500 502 503 504 = @accounting_unavailable;
        # A throttled request returns the platform error envelope, not nginx's HTML page.
        error_page 429 = @design_rate_limited;
        limit_req zone=design_write burst=60 nodelay;
        limit_req_status 429;
        # A layout tree is the largest legitimate body here; the service applies its own
        # per-path ceiling (DESIGN_MAX_CANVAS_BODY_BYTES) before parsing any JSON.
        client_max_body_size 5m;
        auth_request /_design_authorize;
        auth_request_set $gateway_auth_status $upstream_status;
        auth_request_set $design_actor_context $upstream_http_x_actor_context;
        auth_request_set $design_actor_signature $upstream_http_x_actor_signature;
        proxy_set_header X-Actor-Context $design_actor_context;
        proxy_set_header X-Actor-Signature $design_actor_signature;
        rewrite ^/design(/.*)$ $1 break;
        proxy_pass http://design_upstream;
        include    conf.d/proxy.include;
    }
    location @design_rate_limited {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"rate_limited","message":"too many layout write requests"}}';
    }
    location @accounting_unauthorized {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 401 '{"error":{"code":"authentication_required","message":"authentication is required"}}';
    }
    location @voucher_rate_limited {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"rate_limited","message":"too many voucher write requests"}}';
    }
    location @accounting_forbidden {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 403 '{"error":{"code":"permission_denied","message":"company access is not permitted"}}';
    }
    location @accounting_unavailable {
        # auth_request treats an upstream 429 as an error; retain its rate-limit meaning.
        if ($gateway_auth_status = 429) {
            add_header Cache-Control no-store always;
            add_header Retry-After 60 always;
            return 429 '{"error":{"code":"rate_limited","message":"too many authentication requests; retry after the indicated delay"}}';
        }
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"dependency_unavailable","message":"authentication service is unavailable"}}';
    }

    # Anything else at the nginx root returns a JSON hint so devs know
    # to hit /<service>/... rather than the bare path.
    location / {
        default_type application/json;
        return 404 '{"error":"unknown service prefix","hint":"use /identity, /audit, /catalog, /notification, /accounting, /vouchers, /reports, or /design"}';
    }
}
