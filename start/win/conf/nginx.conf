# Bill platform nginx config -- foreground-run from start-nginx.bat.
# No `daemon on;` -- nginx stays attached to the batch window (Ctrl+C stops it).

worker_processes  1;
error_log         logs/error.log warn;
pid               logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Query strings and Referer may contain tax IDs, tickets or invitation secrets.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'upstream=$upstream_addr rt=$request_time trace=$bill_trace_id request_id=$request_id';

    map $http_x_trace_id $bill_trace_id {
        "~^[0-9a-fA-F]{32}$" $http_x_trace_id;
        default $request_id;
    }

    access_log    logs/access.log  main;
    sendfile      on;
    keepalive_timeout  65;

    # Report/invoice downloads and bulk catalog uploads can be large. Give the
    # proxy headroom above the in-app caps so a well-formed request is never
    # rejected at the nginx layer before it reaches the API.
    client_max_body_size  150m;
    # Browser standard work gets 300s; the gateway owns the final 30s of
    # headroom so it never wins a timeout race with the caller.
    proxy_read_timeout    330s;
    proxy_send_timeout    330s;
    proxy_connect_timeout 15s;

    # Service upstreams + routing.
    include conf.d/*.conf;
}
