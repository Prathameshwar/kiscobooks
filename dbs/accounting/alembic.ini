; Alembic configuration for the `accounting` service.
;
; One tree per service, one linear chain, no branching (CLAUDE.md §4). A shared
; revision chain would couple the services' migration history and invite the
; cross-service foreign keys the architecture forbids.

[alembic]
script_location = .
prepend_sys_path = .
version_path_separator = os

; Zero-padded sequential revisions, set by hand: 0001, 0002, ...
; A gap or a duplicate is visible in a directory listing; a hash chain hides both.
file_template = %%(rev)s_%%(slug)s

; `sqlalchemy.url` is deliberately absent. env.py reads ACCOUNTING_DATABASE_URL from the
; environment, because a URL here is a credential in the repo (CLAUDE.md §5.9).
; Alembic tolerates the key being missing entirely.

[post_write_hooks]
; Deliberately empty. A formatter rewriting a generated revision makes the
; line-by-line read required by CLAUDE.md §2 harder to trust.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
